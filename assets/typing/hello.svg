<svg width="472" height="78" viewBox="0 0 472 78" fill="none"
    xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hello GitHub @Dynesshely">
  <title>Hello GitHub @Dynesshely</title>
  <style>
    .reveal {
      animation: reveal 4.90s infinite;
    }
    @keyframes reveal {
      0% {
        width: 0;
        animation-timing-function: steps(24, end);
      }
      36.73% { width: 374.4px; }
      69.39% {
        width: 374.4px;
        animation-timing-function: steps(24, end);
      }
      93.88% { width: 0; }
      100% { width: 0; }
    }
    .caret {
      animation: caret 4.90s infinite, blink 1s steps(2, jump-none) infinite;
    }
    @keyframes caret {
      0%             { transform: translateX(0); animation-timing-function: steps(24, end); }
      36.73%   { transform: translateX(374.4px); }
      69.39%   { transform: translateX(374.4px); animation-timing-function: steps(24, end); }
      93.88% { transform: translateX(0); }
      100%           { transform: translateX(0); }
    }
    @keyframes blink {
      0%   { opacity: 1; }
      50%  { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="typing-reveal">
      <rect class="reveal" x="36.0" y="0"
        width="374.4" height="78" />
    </clipPath>
  </defs>
  <g clip-path="url(#typing-reveal)">
    <text x="36.0" y="48" fill="#6E87A6" font-family="'Fira Code', 'Cascadia Code', 'Segoe UI Mono', 'SFMono-Regular', Consolas, monospace"
      font-size="26" font-weight="500" letter-spacing="0">Hello GitHub @Dynesshely</text>
  </g>
  <rect class="caret" x="37.0"
    y="24.1" width="2"
    height="29.9" fill="#A9B8CC" />
</svg>
