name: README assets

# The status panel in README.md is rendered by renderer/ (plain Node, no PHP/Go
# runtime). This workflow rebuilds it on a schedule and commits the result.
#
# The older per-card generators in tools/ and the vendored services in vendor/ are
# kept in the repository only as a manual fallback: they are no longer executed
# here, so this job needs nothing but Node.

on:
  schedule:
    # GitHub Actions cron is UTC: every 5 hours.
    - cron: "0 */5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "renderer/**"
      - "tools/check.mjs"
      - "assets/**"
      - "demos/**"
      - "README.md"
      - ".github/workflows/readme-assets.yml"
  push:
    branches: [main]
    paths:
      - "renderer/**"
      - "tools/check.mjs"
      - "assets/**"
      - "demos/**"
      - "README.md"
      - ".github/workflows/readme-assets.yml"

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate the status panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Report missing optional secrets
        env:
          PAT_1: ${{ secrets.PAT_1 }}
        run: |
          if [ -z "${PAT_1}" ]; then
            echo "::warning title=PAT_1 secret is not set::the GitHub stats and top-languages panels need a personal access token; without it those panels render a placeholder and the committed SVGs are left untouched."
          fi

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci

      - name: Generate the composed status panel
        working-directory: renderer
        env:
          # The vendored github-readme-stats fetchers look for PAT_1..PAT_n. The
          # workflow's own GITHUB_TOKEN is scoped to this repository and cannot read
          # other accounts' data, so it is only a fallback for the fetchers' env
          # lookup - the panels degrade to a placeholder rather than failing.
          PAT_1: ${{ secrets.PAT_1 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/index.mjs

      - name: Verify README references
        run: node tools/check.mjs

      - name: Commit regenerated assets
        # PR runs must not write to the repository; they only validate.
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- assets; then
            echo "Assets are already up to date - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore(assets): regenerate README images" -m "Rendered from renderer/ via src/index.mjs."
          git push

      - name: Upload generated assets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-assets
          path: assets/
          if-no-files-found: warn
