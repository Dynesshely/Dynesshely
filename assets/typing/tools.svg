<svg width="132" height="60" viewBox="0 0 132 60" fill="none"
    xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tools">
  <title>Tools</title>
  <style>
    tspan {
      opacity: 1;
      animation: glyph 110ms both;
    }
    @keyframes glyph {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
  <text x="36.0" y="37" fill="#6E87A6" font-family="'Fira Code', 'Cascadia Code', 'Segoe UI Mono', 'SFMono-Regular', Consolas, monospace"
    font-size="20" font-weight="500" letter-spacing="0" xml:space="preserve"><tspan style="animation-delay:0.200s">T</tspan><tspan style="animation-delay:0.440s">o</tspan><tspan style="animation-delay:0.680s">o</tspan><tspan style="animation-delay:0.920s">l</tspan><tspan style="animation-delay:1.160s">s</tspan></text>
  
</svg>
