<svg width="312" height="60" viewBox="0 0 312 60" fill="none"
    xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Programing Languages">
  <title>Programing Languages</title>
  <style>
    tspan {
      opacity: 1;
      animation: glyph 110ms both;
    }
    @keyframes glyph {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
  <text x="36.0" y="37" fill="#6E87A6" font-family="'Fira Code', 'Cascadia Code', 'Segoe UI Mono', 'SFMono-Regular', Consolas, monospace"
    font-size="20" font-weight="500" letter-spacing="0" xml:space="preserve"><tspan style="animation-delay:0.200s">P</tspan><tspan style="animation-delay:0.260s">r</tspan><tspan style="animation-delay:0.320s">o</tspan><tspan style="animation-delay:0.380s">g</tspan><tspan style="animation-delay:0.440s">r</tspan><tspan style="animation-delay:0.500s">a</tspan><tspan style="animation-delay:0.560s">m</tspan><tspan style="animation-delay:0.620s">i</tspan><tspan style="animation-delay:0.680s">n</tspan><tspan style="animation-delay:0.740s">g</tspan><tspan style="animation-delay:0.800s">&#160;</tspan><tspan style="animation-delay:0.860s">L</tspan><tspan style="animation-delay:0.920s">a</tspan><tspan style="animation-delay:0.980s">n</tspan><tspan style="animation-delay:1.040s">g</tspan><tspan style="animation-delay:1.100s">u</tspan><tspan style="animation-delay:1.160s">a</tspan><tspan style="animation-delay:1.220s">g</tspan><tspan style="animation-delay:1.280s">e</tspan><tspan style="animation-delay:1.340s">s</tspan></text>
  
</svg>
